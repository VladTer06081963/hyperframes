<!doctype html>
<!--
  GLB Exploded View: load a GLB/glTF model, take its named mesh nodes as parts,
  and explode / reassemble them as a pure function of time. Optional cutaway plane
  and HTML labels pinned to live world positions.

  Seek-safe: every frame is render(t), driven by one linear GSAP clock.
  Meshopt-compressed models (EXT_meshopt_compression) are supported.
-->
<html
  lang="en"
  data-composition-variables='[
    { "id": "model_url", "type": "string", "role": "content", "label": "Model URL (.glb or .gltf)", "description": "Path or URL of the model. Named mesh nodes become the parts.", "default": "" },
    { "id": "labels", "type": "string", "role": "content", "label": "Labels (comma separated part names)", "default": "" },
    { "id": "explode_field", "type": "string", "role": "motion", "label": "Explode field", "description": "radial | hierarchical | symmetric-fan | pile", "default": "radial" },
    { "id": "systems", "type": "string", "role": "content", "label": "Systems (comma separated)", "description": "Keep only parts under these root nodes (e.g. skeleton). Empty = all parts.", "default": "" },
    { "id": "start_state", "type": "string", "role": "motion", "label": "Start state", "description": "assembled | pile — the pose the film starts from (pile needs explode_field=pile)", "default": "assembled" },
    { "id": "assemble_start", "type": "number", "role": "motion", "label": "Assembly start (s)", "default": 0.8, "min": 0, "step": 0.1 },
    { "id": "sequence_step", "type": "number", "role": "motion", "label": "Stagger per part (s)", "description": "Delay between two consecutive parts", "default": 0.045, "min": 0, "step": 0.005 },
    { "id": "sequence_duration", "type": "number", "role": "motion", "label": "Motion per part (s)", "default": 0.3, "min": 0.02, "step": 0.02 },
    { "id": "assembly_step_beats", "type": "number", "role": "motion", "label": "Assembly step (beats per part)", "description": "Stagger measured in beats of the music grid - overrides sequence_step when > 0", "default": 0, "min": 0, "max": 2, "step": 0.25 },
    { "id": "music_bpm", "type": "number", "role": "motion", "label": "Music BPM", "description": "Tempo of the beat grid the assembly and the dance follow", "default": 120, "min": 40, "max": 200, "step": 1 },
    { "id": "beat_offset", "type": "number", "role": "motion", "label": "Beat offset (s)", "description": "Shift of the beat grid in time", "default": 0, "min": -2, "max": 2, "step": 0.05 },
    { "id": "dance_amount", "type": "number", "role": "motion", "label": "Dance amount", "description": "0 = no dancing, 1 = full beat dance", "default": 0, "min": 0, "max": 2, "step": 0.05 },
    { "id": "dance_start", "type": "number", "role": "motion", "label": "Dance start (s)", "default": 0, "min": 0, "step": 0.25 },
    { "id": "dance_end", "type": "number", "role": "motion", "label": "Dance end (s)", "description": "0 = dance until the end of the film", "default": 0, "min": 0, "step": 0.25 },
    { "id": "dance_fade", "type": "number", "role": "motion", "label": "Dance fade (s)", "default": 0.6, "min": 0.05, "step": 0.05 },
    { "id": "pile_radius", "type": "number", "role": "motion", "label": "Pile radius (fraction of body height)", "default": 0.32, "min": 0.05, "max": 1, "step": 0.02 },
    { "id": "pile_heap", "type": "number", "role": "motion", "label": "Pile heap (fraction of body height)", "default": 0.1, "min": 0, "max": 0.4, "step": 0.01 },
    { "id": "pile_top_part", "type": "string", "role": "motion", "label": "Part on top of the pile", "default": "skull" },
    { "id": "disassemble_start", "type": "number", "role": "motion", "label": "Disassemble start (s)", "description": "0 = never; after this time the parts fly back into the heap", "default": 0, "min": 0, "step": 0.25 },
    { "id": "disassemble_step", "type": "number", "role": "motion", "label": "Disassemble stagger per part (s)", "description": "0 = same as the assembly stagger; the parts leave in reverse order", "default": 0, "min": 0, "step": 0.005 },
    { "id": "disassemble_duration", "type": "number", "role": "motion", "label": "Disassemble motion per part (s)", "default": 0.35, "min": 0.02, "step": 0.02 },
    { "id": "title_text", "type": "string", "role": "content", "label": "Title text", "default": "" },
    { "id": "title_start", "type": "number", "role": "motion", "label": "Title start (s)", "default": 0, "min": 0, "step": 0.25 },
    { "id": "title_end", "type": "number", "role": "motion", "label": "Title end (s)", "description": "0 = until the end of the film", "default": 0, "min": 0, "step": 0.25 },
    { "id": "title_fade", "type": "number", "role": "motion", "label": "Title fade (s)", "default": 0.5, "min": 0.05, "step": 0.05 },
    { "id": "title_y", "type": "number", "role": "style", "label": "Title height (% of the frame)", "default": 50, "min": 5, "max": 95, "step": 1 },
    { "id": "camera_pull_start", "type": "number", "role": "camera", "label": "Camera pull start (s)", "default": 0.3, "min": 0, "step": 0.1 },
    { "id": "camera_pull_duration", "type": "number", "role": "camera", "label": "Camera pull duration (s)", "default": 2.4, "min": 0.1, "step": 0.1 },
    { "id": "stage", "type": "string", "role": "style", "label": "Stage", "description": "none | studio — floor, gradient backdrop and soft shadows", "default": "none" },
    { "id": "explode_amount", "type": "number", "role": "motion", "label": "Explode amount", "default": 1.1, "min": 0, "max": 3, "step": 0.05 },
    { "id": "explode_start", "type": "number", "role": "motion", "label": "Explode start (s)", "default": 0.5, "min": 0, "step": 0.1 },
    { "id": "explode_duration", "type": "number", "role": "motion", "label": "Explode duration (s)", "default": 1.5, "min": 0.1, "step": 0.1 },
    { "id": "explode_return", "type": "number", "role": "motion", "label": "Reassemble duration (s, 0 = stay exploded)", "default": 0, "min": 0, "step": 0.1 },
    { "id": "camera_orbit", "type": "number", "role": "motion", "label": "Camera orbit (degrees)", "default": 0, "min": -180, "max": 180, "step": 5 },
    { "id": "camera_orbit_speed", "type": "number", "role": "camera", "label": "Camera orbit speed (degrees per second)", "description": "Slow orbit around the subject - pure function of time", "default": 0, "min": -30, "max": 30, "step": 0.5 },
    { "id": "camera_fov", "type": "number", "role": "camera", "label": "Camera FOV", "default": 38, "min": 12, "max": 90, "step": 1 },
    { "id": "camera_zoom", "type": "string", "role": "camera", "label": "Camera zoom mode", "description": "auto — pull back with the explosion; exploded — always frame the exploded pose; assembled — always frame the assembled pose", "default": "auto" },
    { "id": "camera_margin", "type": "number", "role": "camera", "label": "Camera margin", "description": "Fraction of the frame left around the subject", "default": 1.12, "min": 1.0, "max": 2.0, "step": 0.02 },
    { "id": "cutaway", "type": "string", "role": "content", "label": "Cutaway axis", "description": "none | x | z — the plane cuts the model open", "default": "none" },
    { "id": "cutaway_position", "type": "number", "role": "content", "label": "Cutaway position (-1..1 of the model)", "default": 0, "min": -1, "max": 1, "step": 0.05 },
    { "id": "background", "type": "color", "role": "style", "label": "Background", "default": "#05070d" },
    { "id": "width", "type": "number", "role": "style", "label": "Canvas width (px)", "description": "Must match the render viewport, otherwise the frame is cropped", "default": 1920, "min": 320, "max": 3840, "step": 1 },
    { "id": "height", "type": "number", "role": "style", "label": "Canvas height (px)", "description": "Must match the render viewport, otherwise the frame is cropped", "default": 1080, "min": 240, "max": 2160, "step": 1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GLB Exploded View</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      #gev-root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      #gev-root canvas {
        display: block;
      }
      .gev-label {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: calc(6px * var(--gev-scale, 1)) calc(12px * var(--gev-scale, 1));
        border-radius: calc(8px * var(--gev-scale, 1));
        background: rgba(5, 7, 13, 0.82);
        border: 1px solid rgba(232, 236, 245, 0.28);
        color: #e8ecf5;
        font: 500 calc(28px * var(--gev-scale, 1))/1.2 "Inter", system-ui, sans-serif;
        letter-spacing: 0.01em;
        white-space: nowrap;
        pointer-events: none;
      }
      .gev-title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #eef1f7;
        font-family: "Lato Thin", "Lato Hairline", "Lato", "Helvetica Neue",
          "DejaVu Sans", sans-serif;
        font-weight: 200;
        font-size: calc(76px * var(--gev-scale, 1));
        letter-spacing: 0.38em;
        /* the trailing letter-space would push the line off centre */
        text-indent: 0.38em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        /* The title crosses the subject, and the subject is bone white: a
           dark band behind the letters is what keeps the title readable. */
        padding: calc(14px * var(--gev-scale, 1)) calc(46px * var(--gev-scale, 1));
        background: rgba(5, 7, 13, 0.62);
        border-radius: calc(4px * var(--gev-scale, 1));
        text-shadow: 0 calc(2px * var(--gev-scale, 1)) calc(20px * var(--gev-scale, 1))
          rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div
      id="gev-root"
      data-composition-id="glb-exploded-view"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    ></div>

    <script>
      (function () {
        var defaults = {
          model_url: "",
          labels: "",
          explode_field: "radial",
          systems: "",
          start_state: "assembled",
          assemble_start: 0.8,
          sequence_step: 0.045,
          sequence_duration: 0.3,
          assembly_step_beats: 0,
          music_bpm: 120,
          beat_offset: 0,
          dance_amount: 0,
          dance_start: 0,
          dance_end: 0,
          dance_fade: 0.6,
          pile_radius: 0.32,
          pile_heap: 0.1,
          pile_top_part: "skull",
          disassemble_start: 0,
          disassemble_step: 0,
          disassemble_duration: 0.35,
          title_text: "",
          title_start: 0,
          title_end: 0,
          title_fade: 0.5,
          title_y: 50,
          camera_pull_start: 0.3,
          camera_pull_duration: 2.4,
          stage: "none",
          explode_amount: 1.1,
          explode_start: 0.5,
          explode_duration: 1.5,
          explode_return: 0,
          camera_orbit: 0,
          camera_orbit_speed: 0,
          camera_fov: 38,
          camera_zoom: "auto",
          camera_margin: 1.12,
          cutaway: "none",
          cutaway_position: 0,
          background: "#05070d",
          width: 1920,
          height: 1080
        };
        var scoped = {};
        try {
          var q = new URLSearchParams(window.location.search);
          q.forEach(function (value, key) {
            scoped[key] = value;
          });
        } catch (e) {
          /* no query params */
        }
        var vars = Object.assign(
          {},
          defaults,
          (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {},
          window.__hfVariables || {},
          scoped
        );
        var root = document.getElementById("gev-root");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 6);

        var clock = { t: 0 };
        var scene = { vars: vars, clock: clock, render: null, duration: duration };
        window.__glbExplodedView = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["glb-exploded-view"] = new Promise(function (resolve) {
          scene.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (scene.render) scene.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["glb-exploded-view"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/loaders/GLTFLoader.js/+esm";
      import { MeshoptDecoder } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/libs/meshopt_decoder.module.js/+esm";

      const host = window.__glbExplodedView;
      const V = host.vars;
      const root = document.getElementById("gev-root");
      /* The canvas size is pinned by variables, not by the window: the frame
         size must be reproducible. It MUST match the capture viewport, or the
         frame is cropped to the top-left corner of a larger canvas. */
      const W = Number(V.width) || 1920;
      const H = Number(V.height) || 1080;
      document.documentElement.style.width = W + "px";
      document.documentElement.style.height = H + "px";
      document.body.style.width = W + "px";
      document.body.style.height = H + "px";
      root.style.width = W + "px";
      root.style.height = H + "px";
      // The label chrome scales with the frame, so a 720p frame does not get
      // 1080p-sized labels covering the subject.
      root.style.setProperty("--gev-scale", String(H / 1080));

      const canvas = document.createElement("canvas");
      root.appendChild(canvas);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, true);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.localClippingEnabled = true;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(V.background || "#05070d");
      const camera = new THREE.PerspectiveCamera(38, W / H, 0.01, 2000);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x1b2333, 1.8));
      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(-2, 4, 3);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.9);
      fill.position.set(3, 1, -2);
      scene.add(fill);

      /* ---------- stage ----------
         A dark studio: a vertical gradient backdrop, a matte floor at y=0 and
         soft shadows. The bones lie on that floor in the pile, so the floor
         is what makes the heap read as a heap and not as floating debris. */
      const STAGE = (V.stage || "none").toLowerCase();
      if (STAGE === "studio") {
        const gradCanvas = document.createElement("canvas");
        gradCanvas.width = 8;
        gradCanvas.height = 512;
        const g2 = gradCanvas.getContext("2d");
        const gradient = g2.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, "#0b1120");
        gradient.addColorStop(0.55, "#080b14");
        gradient.addColorStop(1, "#04060b");
        g2.fillStyle = gradient;
        g2.fillRect(0, 0, 8, 512);
        const backdrop = new THREE.CanvasTexture(gradCanvas);
        backdrop.colorSpace = THREE.SRGBColorSpace;
        scene.background = backdrop;

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(60, 60),
          new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 1.0, metalness: 0.0 })
        );
        /* Fog hides the far edge of the floor: the room fades into the
           backdrop instead of ending at a hard horizon line. */
        scene.fog = new THREE.Fog(0x080b14, 3.5, 14);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.002;
        floor.receiveShadow = true;
        scene.add(floor);

        /* Studio light: one strong key with a soft shadow, a dim fill, and a
           much dimmer ambient than the default - the bones have to read as
           lit objects on a dark floor, not as flat white shapes. */
        scene.children.forEach((child) => {
          if (child.isHemisphereLight) child.intensity = 0.55;
        });
        key.intensity = 3.4;
        fill.intensity = 0.5;

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.left = -1.8;
        key.shadow.camera.right = 1.8;
        key.shadow.camera.top = 1.8;
        key.shadow.camera.bottom = -1.8;
        key.shadow.camera.near = 0.5;
        key.shadow.camera.far = 14;
        key.shadow.bias = -0.0009;
        key.shadow.normalBias = 0.012;
      }

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);

      /* ---------- parts = named mesh nodes ---------- */
      const parts = [];
      let modelRoot = null;

      /* Which parts of the model are kept. A GLB body is built from named
         systems (skeleton, muscle, organs...); a film about bones needs the
         skeleton only. Parts outside the filter are hidden, not deleted, so
         the asset on disk stays the single source of truth. */
      let SYSTEM_FILTER = (V.systems || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);

      function collectParts(node, parent, chain, isModelRoot) {
        node.updateMatrixWorld(true);
        const name = node.name || "";
        const nextChain = chain ? chain.concat(name ? [name] : []) : name ? [name] : [];
        const ancestors = nextChain.slice(0, -1);
        const keep =
          SYSTEM_FILTER.length === 0 ||
          isModelRoot ||
          SYSTEM_FILTER.includes(name) ||
          ancestors.some((a) => SYSTEM_FILTER.includes(a));
        if (!keep) {
          node.visible = false;
          return;
        }
        if (node.isMesh && name) {
          const box = new THREE.Box3().setFromObject(node);
          const center = box.getCenter(new THREE.Vector3());
          modelRoot.worldToLocal(center);
          parts.push({
            node: node,
            name: name,
            parent: parent && parent.name ? parent.name : "",
            chain: ancestors,
            center: center,
            base: node.position.clone(),
            size: box.getSize(new THREE.Vector3()).length(),
            worldPos: node.getWorldPosition(new THREE.Vector3()),
            worldQuat: node.getWorldQuaternion(new THREE.Quaternion()),
            worldBox: box.clone(),
          });
        }
        const children = node.children ? node.children.slice() : [];
        children.forEach((child) => collectParts(child, node, nextChain, false));
      }

      /* Asset URLs are resolved against the project root, not against the
         document: the composition may live in compositions/ while assets live
         in assets/. Absolute and remote URLs are used as-is. */
      const modelUrl = V.model_url
        ? /^(https?:|data:|blob:)/.test(String(V.model_url))
          ? String(V.model_url)
          : "/" + String(V.model_url).replace(/^\/+/, "")
        : "";

      if (modelUrl) {
        const gltf = await loader.loadAsync(modelUrl);
        modelRoot = gltf.scene;
        scene.add(modelRoot);
        collectParts(modelRoot, null, null, true);
      } else {
        // Built-in fallback: a simple three-part object so the block is testable
        // without an asset.
        modelRoot = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xc9d3e3, roughness: 0.55, metalness: 0.1 });
        ["base", "body", "lid"].forEach((name, i) => {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(1 - i * 0.2, 0.35, 1 - i * 0.2), mat);
          mesh.name = name;
          mesh.position.y = i * 0.42;
          modelRoot.add(mesh);
        });
        scene.add(modelRoot);
        // The built-in fallback has no systems: the filter does not apply.
        SYSTEM_FILTER = [];
        collectParts(modelRoot, null, null, true);
      }

      /* ---------- helpers ---------- */
      const _inv = new THREE.Matrix4();
      const _pq = new THREE.Quaternion();
      /* Set a node by its WORLD transform. The parts live under a system
         group, so a world pose has to be converted into the parent space. */
      function setWorldTransform(node, worldPos, worldQuat) {
        const parent = node.parent;
        if (!parent) {
          node.position.copy(worldPos);
          node.quaternion.copy(worldQuat);
          return;
        }
        parent.updateMatrixWorld(true);
        _inv.copy(parent.matrixWorld).invert();
        node.position.copy(worldPos).applyMatrix4(_inv);
        parent.getWorldQuaternion(_pq).invert();
        node.quaternion.copy(_pq).multiply(worldQuat);
      }
      function smoothstep01(x) {
        const k = Math.min(1, Math.max(0, x));
        return k * k * (3 - 2 * k);
      }
      function lerpBox(a, b, t) {
        const min = new THREE.Vector3().lerpVectors(a.min, b.min, t);
        const max = new THREE.Vector3().lerpVectors(a.max, b.max, t);
        return new THREE.Box3(min, max);
      }
      /* Live world box of the visible parts only. Box3.setFromObject() would
         also count the hidden systems (it ignores `visible`), which would
         frame the camera around organs the film does not show. */
      function partsBox() {
        const box = new THREE.Box3();
        parts.forEach((p) => {
          p.node.updateWorldMatrix(true, false);
          const g = p.node.geometry;
          if (!g) return;
          if (!g.boundingBox) g.computeBoundingBox();
          box.union(g.boundingBox.clone().applyMatrix4(p.node.matrixWorld));
        });
        return box;
      }
      function hashSeed(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h >>> 0;
      }
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ---------- pile: a heap of bones on the floor ----------
         Every part gets its own deterministic place in the heap (pseudo-random
         from its name, so the heap is identical on every run), lies flat, and
         the skull is put on top of the heap. The assembly then moves the
         parts one by one into their anatomical pose: feet first, head last. */
      const PILE = (V.explode_field || "").toLowerCase() === "pile";
      const START_FROM_PILE = (V.start_state || "assembled").toLowerCase() === "pile";
      let pileBox = null;
      let assemblyOrder = [];
      let pileBodyH = 0;

      if (PILE) {
        const bodyBox = new THREE.Box3();
        parts.forEach((p) => bodyBox.union(p.worldBox));
        const bodyH = Math.max(1e-4, bodyBox.max.y - bodyBox.min.y);
        pileBodyH = bodyH;
        const bodyCenter = bodyBox.getCenter(new THREE.Vector3());
        const pileR = Math.max(1e-4, (Number(V.pile_radius) || 0.32) * bodyH);
        const heapH = Math.max(0, (Number(V.pile_heap) || 0.1) * bodyH);

        parts.forEach((p) => {
          const size = p.worldBox.getSize(new THREE.Vector3());
          const dims = [size.x, size.y, size.z];
          p.pileThick = Math.max(1e-4, Math.min(dims[0], dims[1], dims[2]));
          const longIdx = dims.indexOf(Math.max(dims[0], dims[1], dims[2]));
          const rnd = mulberry32(hashSeed(p.name));
          const u1 = rnd(), u2 = rnd(), u3 = rnd(), u4 = rnd(), u5 = rnd(), u6 = rnd();
          const angle = u1 * Math.PI * 2;
          const radius = pileR * Math.sqrt(u2) * 0.9;
          const mound = heapH * (1 - (radius / pileR) * (radius / pileR)) * 0.5;
          // Lie flat: the longest axis of the bone becomes horizontal.
          const qLie = new THREE.Quaternion();
          if (longIdx === 1) qLie.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
          const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), u4 * Math.PI * 2);
          const qTilt = new THREE.Quaternion().setFromEuler(
            new THREE.Euler((u5 - 0.5) * 0.45, 0, (u6 - 0.5) * 0.45)
          );
          p.pileQuat = qYaw.clone().multiply(qTilt).multiply(qLie).multiply(p.worldQuat);
          p.pilePos = new THREE.Vector3(
            bodyCenter.x + Math.cos(angle) * radius,
            p.pileThick * 0.5 + mound + u3 * 0.004 * bodyH,
            bodyCenter.z + Math.sin(angle) * radius
          );
          p.pileArc = (0.04 + 0.14 * u5) * bodyH;
        });

        /* The head lies on top of the heap. */
        const topName = (V.pile_top_part || "skull").trim();
        const top = parts.find((p) => p.name === topName);
        if (top) {
          let heapTop = 0;
          parts.forEach((p) => {
            if (p !== top) heapTop = Math.max(heapTop, p.pilePos.y + p.pileThick * 0.5);
          });
          const rnd = mulberry32(hashSeed(topName + "-on-top"));
          const jx = (rnd() - 0.5) * 0.08 * bodyH;
          const jz = (rnd() - 0.5) * 0.08 * bodyH;
          top.pilePos.set(
            bodyCenter.x + jx,
            heapTop + top.pileThick * 0.5 + 0.002 * bodyH,
            bodyCenter.z + jz
          );
        }

        /* Assembly order: the lowest bone first, the head last. */
        assemblyOrder = parts
          .slice()
          .sort((a, b) => a.worldPos.y - b.worldPos.y || (a.name < b.name ? -1 : 1));
        assemblyOrder.forEach((p, i) => {
          p.orderIndex = i;
        });

        const assembledBox = new THREE.Box3();
        parts.forEach((p) => setWorldTransform(p.node, p.worldPos, p.worldQuat));
        assembledBox.copy(partsBox());
        parts.forEach((p) => setWorldTransform(p.node, p.pilePos, p.pileQuat));
        pileBox = partsBox();
      }

      const assemblyStart = Number(V.assemble_start) || 0;
      const musicBpm = Number(V.music_bpm) || 120;
      const secondsPerBeat = 60 / musicBpm;
      const beatOffset = Number(V.beat_offset) || 0;
      /* The stagger can be measured in beats instead of seconds: then every
         bone lands on the same grid as the music, whatever the tempo. */
      const stepInBeats = Number(V.assembly_step_beats) || 0;
      const sequenceStep = stepInBeats > 0
        ? secondsPerBeat * stepInBeats
        : Math.max(0, Number(V.sequence_step) || 0);
      const sequenceDuration = Math.max(0.02, Number(V.sequence_duration) || 0.3);

      /* ---------- the way back: the heap again ----------
         The same clock, run backwards: the parts leave in the reverse order
         of their arrival, so the last bone to be assembled is the first to
         fall. Everything stays a pure function of time. */
      const DIS_START = Number(V.disassemble_start) || 0;
      const DIS_STEP_RAW = Number(V.disassemble_step) || 0;
      const DIS_STEP = DIS_STEP_RAW > 0 ? DIS_STEP_RAW : sequenceStep;
      const DIS_DUR = Math.max(0.02, Number(V.disassemble_duration) || 0.35);
      const PART_COUNT = parts.length;
      let frozenPose = null;
      /** The dance pose frozen at the moment the parts start to leave: the
          bones fall back from where they stood, not from where they dance. */
      function frozenDancePose() {
        if (!frozenPose) {
          frozenPose = new Map();
          updateDance(DIS_START, frozenPose);
        }
        return frozenPose;
      }


      /* ---------- dance: the skeleton moves on the beat ----------
         The beat grid is the same clock as the music (music_bpm), so every
         motion lands on a beat and the pose stays a pure function of time.

         The rig is built from the anatomy of the asset, not from hard-coded
         numbers: the joints are found on the real geometry (the end of a bone
         that is closest to the joint it belongs to), so the same code dances
         with any skeleton-shaped asset. */
      const DANCE_AMOUNT = Number(V.dance_amount) || 0;
      const DANCE = DANCE_AMOUNT > 0;
      const DANCE_START = Number(V.dance_start) || 0;
      const DANCE_END = Number(V.dance_end) || 0;
      const DANCE_FADE = Math.max(0.05, Number(V.dance_fade) || 0.6);
      let suppressDance = false;

      function roleOf(name) {
        if (/^skull$|^vertebrae_C/.test(name)) return "head";
        if (/^femur_/.test(name)) return "leg";
        if (/^humerus_/.test(name)) return "arm";
        if (/^clavicula_|^scapula_/.test(name)) return "shoulder";
        if (/^hip_|^sacrum$|^vertebrae_L5$|^vertebrae_S1$/.test(name)) return "hips";
        return "torso";
      }

      const rig = { hips: [], torso: [], head: [], shoulder: [], arm: [], leg: [] };
      parts.forEach((p) => {
        p.role = roleOf(p.name);
        if (rig[p.role]) rig[p.role].push(p);
      });

      /** The corner of a bone's world box that is closest to the joint it
          belongs to: the proximal end of the bone. */
      function proximalCorner(p, target) {
        const b = p.worldBox;
        let best = null;
        let bestD = Infinity;
        for (let i = 0; i < 8; i++) {
          const c = new THREE.Vector3(
            i & 1 ? b.max.x : b.min.x,
            i & 2 ? b.max.y : b.min.y,
            i & 4 ? b.max.z : b.min.z
          );
          const d = c.distanceToSquared(target);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }
        return best || p.worldPos.clone();
      }

      const hipsPivot = (function () {
        const c = new THREE.Vector3();
        if (!rig.hips.length) return c;
        rig.hips.forEach((p) => { c.add(p.worldPos); });
        return c.divideScalar(rig.hips.length);
      })();
      const sacrumPos = (parts.find((p) => p.name === "sacrum") ||
        rig.hips[0] || { worldPos: hipsPivot }).worldPos.clone();
      const neckPos = (parts.find((p) => p.name === "vertebrae_C7") ||
        parts.find((p) => p.name === "skull") ||
        { worldPos: hipsPivot }).worldPos.clone();

      const armPivot = {};
      const legPivot = {};
      rig.arm.forEach((p) => {
        const side = /_left$/.test(p.name) ? "left" : "right";
        const anchor = parts.find((q) => q.name === "clavicula_" + side);
        armPivot[side] = proximalCorner(p, anchor ? anchor.worldPos : hipsPivot);
      });
      rig.leg.forEach((p) => {
        const side = /_left$/.test(p.name) ? "left" : "right";
        const anchor = parts.find((q) => q.name === "hip_" + side);
        legPivot[side] = proximalCorner(p, anchor ? anchor.worldPos : hipsPivot);
      });

      const AXIS_X = new THREE.Vector3(1, 0, 0);
      const AXIS_Y = new THREE.Vector3(0, 1, 0);
      const AXIS_Z = new THREE.Vector3(0, 0, 1);
      const bodyHeight = Math.max(1e-4, pileBodyH || 1);

      function chainPoint(point, chain) {
        const p = point.clone();
        chain.forEach((d) => {
          p.sub(d.pivot).applyQuaternion(d.quat).add(d.pivot).add(d.pos);
        });
        return p;
      }

      function chainTransform(pos, quat, chain) {
        const p = pos.clone();
        const q = quat.clone();
        chain.forEach((d) => {
          p.sub(d.pivot).applyQuaternion(d.quat).add(d.pivot).add(d.pos);
          q.premultiply(d.quat);
        });
        return { p: p, q: q };
      }

      /** How much of the dance is active at time t (fade in and out). */
      function danceGain(t) {
        if (!DANCE) return 0;
        const up = Math.min(1, Math.max(0, (t - DANCE_START) / DANCE_FADE));
        let down = 1;
        if (DANCE_END > 0) {
          down = Math.min(1, Math.max(0, (DANCE_END - t) / DANCE_FADE));
        }
        return Math.min(up, down);
      }

      /** The dance pose of every part at time t. Pure function of t.
          With `out` the result is written into a map instead of the parts,
          so a pose can be frozen without disturbing the live one. */
      function updateDance(t, out) {
        const write = (p, pos, quat) => {
          if (out) out.set(p.name, { pos: pos, quat: quat });
          else {
            p.dancePos = pos;
            p.danceQuat = quat;
          }
        };
        if (!DANCE || suppressDance) {
          parts.forEach((p) => write(p, p.worldPos, p.worldQuat));
          return;
        }
        const gain = DANCE_AMOUNT * danceGain(t);
        const beat = (t - beatOffset - DANCE_START) / secondsPerBeat;

        /* Hips: the body dips on the beat, sways and twists every two beats. */
        const bob = -0.5 * (1 + Math.cos(2 * Math.PI * beat)) * 0.055 * bodyHeight;
        const sway = Math.sin(Math.PI * beat) * 0.1;
        const twist = Math.sin(Math.PI * beat) * 0.12;
        const hipsDelta = {
          pivot: hipsPivot.clone(),
          quat: new THREE.Quaternion().setFromAxisAngle(AXIS_Y, twist * gain)
            .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, sway * gain)),
          pos: new THREE.Vector3(0, bob * gain, 0),
        };

        /* Spine: a twist that travels up the back. */
        const spinePivot = chainPoint(sacrumPos, [hipsDelta]);
        const spineTwist = Math.sin(Math.PI * beat * 0.5) * 0.1;
        const spineDelta = {
          pivot: spinePivot,
          quat: new THREE.Quaternion().setFromAxisAngle(AXIS_Y, spineTwist * gain),
          pos: new THREE.Vector3(),
        };

        /* Head: nod on the eighth notes, tilt on two beats. */
        const neckPivot = chainPoint(neckPos, [hipsDelta, spineDelta]);
        const nod = Math.sin(4 * Math.PI * beat) * 0.1;
        const tilt = Math.sin(Math.PI * beat * 0.5) * 0.06;
        const headDelta = {
          pivot: neckPivot,
          quat: new THREE.Quaternion().setFromAxisAngle(AXIS_X, nod * gain)
            .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, tilt * gain)),
          pos: new THREE.Vector3(),
        };

        /* Arms and legs: a march - the legs step, the arms swing opposite. */
        const armDelta = {};
        const legDelta = {};
        ["left", "right"].forEach((side) => {
          const offset = side === "left" ? 0 : 0.5;
          const armSwing = -Math.sin(Math.PI * (beat + offset + 0.5)) * 0.6;
          const armOut = (0.5 + 0.5 * Math.sin(2 * Math.PI * beat)) * 0.16;
          armDelta[side] = {
            pivot: chainPoint(armPivot[side] || hipsPivot, [hipsDelta, spineDelta]),
            quat: new THREE.Quaternion().setFromAxisAngle(AXIS_X, armSwing * gain)
              .multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_Z, (side === "left" ? armOut : -armOut) * gain)),
            pos: new THREE.Vector3(),
          };
          /* The CT segmentation has no lower leg, so a big forward swing
             reads as a detached thigh: the step stays small and the femur
             lifts instead of swinging wide. */
          const legSwing = Math.sin(Math.PI * (beat + offset)) * 0.16;
          const legLift = Math.max(0, Math.sin(Math.PI * (beat + offset))) * 0.035 * bodyHeight;
          legDelta[side] = {
            pivot: chainPoint(legPivot[side] || hipsPivot, [hipsDelta]),
            quat: new THREE.Quaternion().setFromAxisAngle(AXIS_X, legSwing * gain),
            pos: new THREE.Vector3(0, legLift * gain, 0),
          };
        });

        parts.forEach((p) => {
          const chain = [];
          const side = /_left$/.test(p.name) ? "left" : "right";
          if (p.role === "hips") {
            chain.push(hipsDelta);
          } else if (p.role === "arm") {
            chain.push(hipsDelta, spineDelta, armDelta[side]);
          } else if (p.role === "leg") {
            chain.push(hipsDelta, legDelta[side]);
          } else if (p.role === "head") {
            chain.push(hipsDelta, spineDelta, headDelta);
          } else {
            chain.push(hipsDelta, spineDelta);
            /* The rib cage ripples: the twist grows towards the shoulders. */
            const h = (p.worldPos.y - hipsPivot.y) / bodyHeight;
            const ripple = Math.sin(Math.PI * (beat * 0.5 - h)) * 0.05;
            chain.push({
              pivot: chainPoint(p.worldPos, chain),
              quat: new THREE.Quaternion().setFromAxisAngle(AXIS_Y, ripple * gain),
              pos: new THREE.Vector3(),
            });
          }
          const moved = chainTransform(p.worldPos, p.worldQuat, chain);
          write(p, moved.p, moved.q);
        });
      }

      /* The assembly: every part flies from the heap into its anatomical
         place, one after another. Pure function of time: the pose at t never
         depends on the pose at t-1. */
      /* How much of the film is already assembled: the camera frames the
         heap and the growing skeleton together, and the standing skeleton
         alone once it is whole. */
      let assemblyProgress = PILE ? 0 : 1;
      function applyPile(t) {
        updateDance(t);
        /* Once the way back has started, the pose the bones leave from is
           frozen: the dance stops where it was when the first bone fell. */
        const goingBack = DIS_START > 0 && t >= DIS_START;
        const frozen = goingBack ? frozenDancePose() : null;
        parts.forEach((p) => {
          const t0 = assemblyStart + p.orderIndex * sequenceStep;
          const up = easeInOutCubic(Math.min(1, Math.max(0, (t - t0) / sequenceDuration)));
          let k = up;
          if (DIS_START > 0) {
            const d0 = DIS_START + (PART_COUNT - 1 - p.orderIndex) * DIS_STEP;
            const down = easeInOutCubic(Math.min(1, Math.max(0, (t - d0) / DIS_DUR)));
            k = up * (1 - down);
          }
          const target = frozen
            ? frozen.get(p.name) || { pos: p.worldPos, quat: p.worldQuat }
            : { pos: p.dancePos || p.worldPos, quat: p.danceQuat || p.worldQuat };
          const fromPos = START_FROM_PILE ? p.pilePos : p.worldPos;
          const toPos = START_FROM_PILE ? target.pos : p.pilePos;
          const fromQuat = START_FROM_PILE ? p.pileQuat : p.worldQuat;
          const toQuat = START_FROM_PILE ? target.quat : p.pileQuat;
          const pos = fromPos.clone().lerp(toPos, k);
          pos.y += Math.sin(Math.PI * k) * p.pileArc;
          const quat = fromQuat.clone().slerp(toQuat, k);
          setWorldTransform(p.node, pos, quat);
        });
        let landed = 0;
        parts.forEach((p) => {
          const t0 = assemblyStart + p.orderIndex * sequenceStep;
          if (t >= t0 + sequenceDuration) landed += 1;
        });
        assemblyProgress = parts.length ? landed / parts.length : 1;
      }

      if (STAGE === "studio") {
        parts.forEach((p) => {
          p.node.castShadow = true;
          p.node.receiveShadow = true;
        });
      }

      /* ---------- explode field ---------- */
      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      const centroid = new THREE.Vector3();
      parts.forEach((p) => centroid.add(p.center));
      centroid.multiplyScalar(1 / Math.max(1, parts.length));
      const maxRadius = Math.max(
        0.0001,
        ...parts.map((p) => p.center.distanceTo(centroid))
      );
      const maxSize = Math.max(0.0001, ...parts.map((p) => p.size));

      function directionsFor(field) {
        const dirs = new Map();
        if (field === "symmetric-fan") {
          // Group parts of similar size, fan each group around its own axis.
          const groups = new Map();
          parts.forEach((p) => {
            const key = Math.round(p.size / (maxSize * 0.03));
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(p);
          });
          groups.forEach((group) => {
            const axis = new THREE.Vector3(0, 1, 0);
            group.forEach((p, i) => {
              const angle = (i * 137.508 * Math.PI) / 180;
              const dir = new THREE.Vector3(
                Math.cos(angle) + 0.3 * axis.x,
                Math.sin(angle) * 0.6 + 0.3 * axis.y,
                Math.sin(angle) * 0.4 + 0.3 * axis.z
              ).normalize();
              dirs.set(p.name, dir);
            });
          });
          return dirs;
        }
        if (field === "hierarchical") {
          // Parts leave along the axis of their nearest ancestor part.
          const byName = new Map(parts.map((p) => [p.name, p]));
          parts.forEach((p) => {
            let anchor = null;
            let cur = p.parent;
            while (cur && !anchor) {
              anchor = byName.get(cur) || null;
              cur = anchor ? anchor.parent : null;
            }
            const base = anchor ? anchor.center : centroid;
            const dir = p.center.clone().sub(base);
            if (dir.lengthSq() < 1e-9) dir.copy(p.center).sub(centroid);
            if (dir.lengthSq() < 1e-9) dir.set(0, 1, 0);
            dirs.set(p.name, dir.normalize());
          });
          return dirs;
        }
        // radial (default)
        parts.forEach((p) => {
          const dir = p.center.clone().sub(centroid);
          if (dir.lengthSq() < 1e-9) dir.set(0, 1, 0);
          dirs.set(p.name, dir.normalize());
        });
        return dirs;
      }

      const field = (V.explode_field || "radial").toLowerCase();
      const dirs = directionsFor(field);
      const amount = Number(V.explode_amount);
      const explodeStart = Number(V.explode_start);
      const explodeDuration = Math.max(0.0001, Number(V.explode_duration));
      const returnDuration = Math.max(0, Number(V.explode_return) || 0);

      // The raw progress of the effect: 0 -> 1 while the parts fly apart and,
      // when a reassemble phase is set, 1 -> 0 while they come back. Pure
      // function of the time, so the film is reproducible frame by frame.
      function explodeProgress(t) {
        if (t <= explodeStart) return 0;
        if (t < explodeStart + explodeDuration) return (t - explodeStart) / explodeDuration;
        if (returnDuration > 0) {
          const rt = (t - explodeStart - explodeDuration) / returnDuration;
          return rt >= 1 ? 0 : 1 - rt;
        }
        return 1;
      }

      // Per-part distance and delay, computed once (pure, time independent).
      const plan = parts.map((p) => {
        const dir = dirs.get(p.name) || new THREE.Vector3(0, 1, 0);
        const dist = amount * Math.max(p.center.distanceTo(centroid), 0.15 * maxRadius);
        const delay = 0.25 * (p.center.distanceTo(centroid) / maxRadius);
        return { part: p, dir: dir, dist: dist, delay: delay };
      });

      function applyExplode(t) {
        if (PILE) {
          applyPile(t);
          return;
        }
        const raw = Math.min(1, Math.max(0, explodeProgress(t)));
        plan.forEach((item) => {
          const window = Math.max(1e-6, 1 - item.delay);
          const k = easeInOutCubic(Math.min(1, Math.max(0, (raw - item.delay) / window)));
          item.part.node.position.copy(item.part.base).addScaledVector(item.dir, item.dist * k);
        });
      }

      /* ---------- cutaway ---------- */
      const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
      let cutEnabled = false;
      function applyCutaway() {
        const axis = (V.cutaway || "none").toLowerCase();
        cutEnabled = axis === "x" || axis === "z";
        if (!cutEnabled) return;
        const box = new THREE.Box3().setFromObject(modelRoot);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const pos = Number(V.cutaway_position) || 0;
        if (axis === "x") {
          clipPlane.normal.set(-1, 0, 0);
          clipPlane.constant = center.x + pos * (size.x / 2);
        } else {
          clipPlane.normal.set(0, 0, -1);
          clipPlane.constant = center.z + pos * (size.z / 2);
        }
        modelRoot.traverse((child) => {
          if (child.isMesh) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              m.clippingPlanes = [clipPlane];
              m.clipShadows = true;
              m.side = THREE.DoubleSide;
            });
          }
        });
      }
      applyCutaway();

      /* ---------- camera ----------
         The camera is a pure function of time as well: it frames the assembled
         pose at t=0 and pulls back to frame the fully exploded pose, so the
         subject never leaves the frame and never looks tiny.
         `camera_zoom`: auto (follow the explosion) | exploded (always frame the
         exploded pose) | assembled (always frame the assembled pose). */
      const ZOOM_MODE = (V.camera_zoom || "auto").toLowerCase();
      const MARGIN = Number(V.camera_margin) || 1.12;
      let fitInfo = null;

      function measurePose(explodeT) {
        applyExplode(explodeT);
        // World matrices must be refreshed before measuring: Box3 reads
        // matrixWorld, and applyExplode only moves the nodes. Without this the
        // exploded pose is measured in the stale (assembled) transforms and the
        // camera never pulls back.
        modelRoot.updateMatrixWorld(true);
        const box = partsBox();
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        return { center: sphere.center.clone(), radius: sphere.radius, box: box.clone() };
      }

      const poseAssembled = measurePose(0);
      const poseExploded = measurePose(explodeStart + explodeDuration);
      const poseFixed =
        ZOOM_MODE === "assembled" ? poseAssembled : ZOOM_MODE === "exploded" ? poseExploded : null;

      /* The camera frames the pose of the CURRENT frame: the subject always
         fills the frame and never leaves it, at any explode amount. It is a
         pure function of time — the pose at t is a pure function of t, and the
         fit is measured from that pose.

         The fit is computed on the box, not on its bounding sphere: a sphere
         around a tall, narrow body wastes most of the frame (the body of the
         CT occupies ~25 % of the width but 100 % of the height). */
      function currentBox() {
        modelRoot.updateMatrixWorld(true);
        return partsBox();
      }

      /* Distance at which every corner of `box` projects inside the frustum.
         Pure arithmetic on the 8 corners — no iteration, no heuristics. */
      function fitDistance(box, dir, fov, aspect, margin) {
        const tanY = Math.tan((fov * Math.PI) / 180 / 2);
        const worldUp = new THREE.Vector3(0, 1, 0);
        const up = worldUp.clone().addScaledVector(dir, -worldUp.dot(dir)).normalize();
        const right = new THREE.Vector3().crossVectors(up, dir).normalize();
        const half = box.getSize(new THREE.Vector3()).multiplyScalar(0.5);
        let d = 0;
        for (let i = 0; i < 8; i++) {
          const o = new THREE.Vector3(
            i & 1 ? half.x : -half.x,
            i & 2 ? half.y : -half.y,
            i & 4 ? half.z : -half.z
          );
          const x = o.dot(right);
          const y = o.dot(up);
          const z = o.dot(dir);
          // depth of the corner along the view axis is (d - z), so the
          // constraint |x| <= tanX * (d - z) gives d >= |x| / tanX + z.
          d = Math.max(d, Math.abs(x) / (tanY * aspect) + z, Math.abs(y) / tanY + z);
        }
        return Math.max(0.001, d * margin);
      }

      function updateCamera(t) {
        /* The framing is measured on the assembly pose, without the dance:
           otherwise the camera would zoom in and out with every bounce. */
        const previousSuppress = suppressDance;
        suppressDance = true;
        applyExplode(t);
        const box = currentBox();
        suppressDance = previousSuppress;
        camera.fov = Number(V.camera_fov) || 38;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        const orbit =
          (((Number(V.camera_orbit) || 0) +
            (Number(V.camera_orbit_speed) || 0) * t) *
            Math.PI) /
          180;
        /* While the heap is on the floor the camera looks at it from lower:
           a heap is flat, and a high camera foreshortens it into a disc. */
        const openingBlend = PILE
          ? smoothstep01(
              (t - (Number(V.camera_pull_start) || 0)) / Math.max(1e-6, Number(V.camera_pull_duration) || 2.4)
            )
          : 1;
        /* When the parts fall back into the heap the camera comes down and
           tightens on it again: the film returns to where it started. */
        const closingBlend =
          DIS_START > 0
            ? smoothstep01((t - DIS_START) / Math.max(1e-6, DIS_DUR + DIS_STEP * PART_COUNT))
            : 0;
        const pileBlend = PILE ? openingBlend * (1 - closingBlend) : 1;
        const dir = new THREE.Vector3(
          Math.sin(orbit) * 0.62 + 0.55,
          0.24 + 0.11 * pileBlend,
          Math.cos(orbit) * 0.75
        ).normalize();
        let fitBox = poseFixed ? poseFixed.box : box;
        let center = poseFixed ? poseFixed.center : box.getCenter(new THREE.Vector3());
        if (PILE) {
          // The heap and the growing skeleton share the frame while the
          // skeleton is still being built. Once it is whole, the heap is out
          // of the picture and the standing skeleton is framed alone.
          const blend = Math.max(1 - smoothstep01(assemblyProgress), closingBlend);
          const union = box.clone().union(pileBox);
          fitBox = lerpBox(box, union, blend);
          center = fitBox.getCenter(new THREE.Vector3());
          // The heap is flat: in a tall frame it would sit in the middle of
          // the picture. Look slightly above it, so it rests in the lower third
          // and the empty space above reads as the room the skeleton will grow
          // into.
          center.y += (1 - openingBlend) * pileBodyH * 0.11;
        }
        /* The corners of the heap's bounding box are empty air, so the heap is
           framed tighter than a box fit would give: the film opens on the
           heap, and the heap has to fill the frame. */
        const fitMargin = PILE
          ? MARGIN * (0.84 + 0.16 * pileBlend)
          : MARGIN;
        const distance = fitDistance(fitBox, dir, camera.fov, camera.aspect, fitMargin);
        camera.position.copy(center).addScaledVector(dir, distance);
        camera.lookAt(center);
        camera.updateMatrixWorld();
        fitInfo = {
          center: center.toArray(),
          size: box.getSize(new THREE.Vector3()).toArray(),
          distance: distance,
          fov: camera.fov,
          aspect: camera.aspect,
          zoomMode: ZOOM_MODE,
        };
        /* The framing was measured on the assembly pose; put the dancing
           pose back before the frame is drawn. */
        applyExplode(t);
      }
      applyExplode(0);
      updateCamera(0);

      /* ---------- labels ---------- */
      const labelEls = [];
      const wanted = (V.labels || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      wanted.forEach((name) => {
        const part = parts.find((p) => p.name === name);
        if (!part) return;
        const el = document.createElement("div");
        el.className = "gev-label";
        el.setAttribute("data-layout-allow-overlap", "");
        el.textContent = name.replace(/_/g, " ");
        root.appendChild(el);
        labelEls.push({ el: el, part: part });
      });

      /* ---------- title ---------- */
      const titleEl = document.createElement("div");
      titleEl.className = "gev-title";
      titleEl.setAttribute("data-layout-allow-overlap", "");
      root.appendChild(titleEl);
      const TITLE_TEXT = (V.title_text || "").trim();
      const TITLE_START = Number(V.title_start) || 0;
      const TITLE_END = Number(V.title_end) || 0;
      const TITLE_FADE = Math.max(0.05, Number(V.title_fade) || 0.5);
      const TITLE_Y = Math.min(95, Math.max(5, Number(V.title_y) || 50));
      titleEl.style.top = TITLE_Y + "%";
      function updateTitle(t) {
        if (!TITLE_TEXT) {
          titleEl.style.opacity = "0";
          return;
        }
        titleEl.textContent = TITLE_TEXT;
        const up = Math.min(1, Math.max(0, (t - TITLE_START) / TITLE_FADE));
        let down = 1;
        if (TITLE_END > 0) down = Math.min(1, Math.max(0, (TITLE_END - t) / TITLE_FADE));
        const gain = Math.min(up, down);
        titleEl.style.opacity = String(gain);
        /* the title settles in: it drifts the last few pixels and rests */
        const drift = (1 - gain) * 22;
        titleEl.style.transform = "translate(-50%, calc(-50% + " + drift + "px))";
      }

      const v = new THREE.Vector3();
      // Labels must not cover each other: resolve collisions deterministically
      // by pushing a label down (or up) until its box is free.
      function placeLabels() {
        const placed = [];
        const measured = labelEls.map((item) => {
          item.part.node.getWorldPosition(v);
          v.project(camera);
          return {
            item: item,
            x: ((v.x + 1) / 2) * W,
            y: ((1 - v.y) / 2) * H,
            w: item.el.offsetWidth || 140,
            h: item.el.offsetHeight || 46,
          };
        });
        measured.sort((a, b) => a.y - b.y || a.x - b.x);
        const overlaps = (box) =>
          placed.some(
            (p) =>
              Math.abs(p.cx - box.cx) < (p.w + box.w) / 2 + 10 &&
              Math.abs(p.cy - box.cy) < (p.h + box.h) / 2 + 10
          );
        measured.forEach((m) => {
          let top = m.y - m.h / 2;
          let guard = 0;
          while (overlaps({ cx: m.x, cy: top + m.h / 2, w: m.w, h: m.h }) && guard < 64) {
            top += m.h + 10;
            guard += 1;
          }
          if (top + m.h > H - 8) {
            top = Math.max(8, m.y - m.h / 2);
            guard = 0;
            while (overlaps({ cx: m.x, cy: top + m.h / 2, w: m.w, h: m.h }) && guard < 64) {
              top -= m.h + 10;
              guard += 1;
            }
          }
          // Keep the label inside the frame: a label pushed out of the
          // viewport is worse than a label slightly off its part.
          top = Math.min(Math.max(8, top), Math.max(8, H - m.h - 8));
          const x = Math.min(Math.max(m.w / 2 + 8, m.x), Math.max(m.w / 2 + 8, W - m.w / 2 - 8));
          placed.push({ cx: x, cy: top + m.h / 2, w: m.w, h: m.h });
          m.item.el.style.left = `${x}px`;
          m.item.el.style.top = `${top + m.h / 2}px`;
        });
      }

      host.render = function (t) {
        applyExplode(t);
        updateCamera(t);
        renderer.render(scene, camera);
        placeLabels();
        updateTitle(t);
      };
      /* HyperFrames contract: the host dispatches `hf-seek` with the target
         time and renders the composition itself. We must draw from that time
         instead of relying on the GSAP ticker, which is throttled or frozen
         in headless capture and therefore produces identical frames. */
      window.addEventListener("hf-seek", function (event) {
        var detail = (event && event.detail) || {};
        var time = typeof detail.time === "number" ? detail.time : 0;
        if (host.render) host.render(time);
        if (typeof detail.waitUntil === "function") {
          detail.waitUntil(Promise.resolve());
        }
      });
      /* Debug/inspection handle: lets tools read the collected parts, the
         computed explode plan and the live scene without reaching into
         three.js internals. */
      host.debug = {
        THREE: THREE,
        // A getter, not a value: fitInfo is replaced on every frame, so a
        // captured reference would report the fit of the first frame only.
        get fit() {
          return fitInfo;
        },
        parts: parts,
        plan: plan,
        scene: scene,
        camera: camera,
        renderer: renderer,
        applyExplode: applyExplode,
        explodeProgress: explodeProgress,
        pile: PILE
          ? {
              pileBox: pileBox,
              order: assemblyOrder.map((p) => p.name),
              top: (V.pile_top_part || "skull"),
            }
          : null,
        partPositions: function () {
          const out = {};
          parts.forEach(function (p) {
            const v = new THREE.Vector3();
            p.node.getWorldPosition(v);
            out[p.name] = [v.x, v.y, v.z];
          });
          return out;
        }
      };
      host.render(0);

      await renderer.compileAsync(scene, camera);
      host.ready();
    </script>
  </body>
</html>
